name: Container Verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published GHCR tag to inspect (for example v0.1.2)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify GHCR multi-arch manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify amd64 and arm64 manifest entries
        run: python3 scripts/verify_ghcr_multarch.py --tag '${{ inputs.tag }}'

      - name: Record live-status rule
        run: echo "Verification proves the tag only; update the distribution ledger manually with the digest and public pull evidence."
