name: Container Verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published GHCR tag to inspect (for example v0.1.2)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify GHCR multi-arch manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select pinned Python 3.15.1
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15.1"

      - name: Verify repository-local Python environment
        run: |
          python -m venv .venv
          .venv/bin/python scripts/verify_python315_runtime.py

      - name: Verify amd64 and arm64 manifest entries
        run: .venv/bin/python scripts/verify_ghcr_multarch.py --tag '${{ inputs.tag }}'

      - name: Record live-status rule
        run: echo "Verification proves the tag only; update the distribution ledger manually with the digest and public pull evidence."
