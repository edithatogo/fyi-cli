name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to:
        description: 'Publish to (testpypi or pypi)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package with twine
      run: |
        twine check dist/*

    - name: Publish to TestPyPI
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'testpypi' || startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
      run: |
        twine upload dist/*

    - name: Publish to PyPI
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'pypi' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha'))
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: |
          dist/*
        draft: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conda-publish:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha')
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install conda-build
      run: |
        python -m pip install --upgrade pip
        pip install conda-build

    - name: Get version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Update recipe
      run: |
        sed -i 's/{% set version = ".*" %}/{% set version = "${{ steps.version.outputs.version }}" %}/' conda/meta.yaml
        HASH=$(curl -sL "https://pypi.org/packages/source/f/fyi-cli/fyi-cli-${{ steps.version.outputs.version }}.tar.gz" | sha256sum | cut -d' ' -f1)
        sed -i "s/PLACEHOLDER_SHA256_HASH/$HASH/" conda/meta.yaml

    - name: Build conda package
      run: |
        conda-build conda/ --output-folder conda-dist

    - name: Upload to Anaconda.org
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
      run: |
        pip install anaconda-client
        anaconda upload conda-dist/noarch/fyi-cli-*.tar.bz2 || echo "Upload failed - may already exist"
