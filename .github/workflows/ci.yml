name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    env:
      # CI has no OS keyring; use an ephemeral test-only backend.
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Install Python dependencies
        run: uv sync --extra dev --frozen

      - name: Run Python test suite
        run: uv run pytest -q

  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    env:
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: uv sync --extra dev --frozen

      - name: Run property-based suites
        run: uv run python scripts/run_property_tests.py

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run workspace tests
        run: cargo test --workspace --all-features

  package-smoke:
    name: Package Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked --package fyi-cli

      - name: Smoke test binary help
        run: ./target/release/fyi-cli --help

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run security audit
        run: cargo audit

      - name: Run cargo-deny
        run: cargo deny check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-

      - name: Run tests with coverage
        # Produce LCOV for Codecov and enforce the project target. An 83%
        # report must fail CI; 90% is a gate, not an informational goal.
        # The process-event exporter has dedicated contract/benchmark tests;
        # downstream archive consumers provide its integration coverage.
        run: |
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info \
            --ignore-filename-regex '(^|/)(main|tui)\.rs$|/tor\.rs$|/jurisdiction\.rs$|/process_events\.rs$'
          cargo llvm-cov report --summary-only --fail-under-lines 90 \
            --ignore-filename-regex '(^|/)(main|tui)\.rs$|/tor\.rs$|/jurisdiction\.rs$|/process_events\.rs$'
          test -f lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: true
          use_oidc: true
          verbose: true

  harness-contract:
    name: Layered Harness Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test harness dependencies
        run: python -m pip install --upgrade uv && uv sync --extra dev --locked

      - name: Validate all test layers
        run: uv run python scripts/verify_test_harness.py

      - name: Run offline harness layers
        run: uv run python scripts/verify_test_harness.py --run

  # Lightweight guard for multi-registry packaging drafts (no Rust/cargo).
  # See docs/release-multi-registry.md and scripts/verify_packaging_assets.py
  packaging-assets:
    name: Packaging Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject partial Rust releases
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify_release_scope.py --base "${{ github.event.pull_request.base.sha }}" --head "$GITHUB_SHA"

      - name: Verify packaging assets
        run: python3 scripts/verify_packaging_assets.py

      - name: Run cross-platform release preflight
        run: python3 scripts/release_preflight.py --json

      - name: Validate registry submission ledger
        run: python3 scripts/validate_registry_submission_ledger.py

      - name: Validate AI plugin submission packets
        run: python3 scripts/validate_ai_plugin_packets.py

      - name: Validate install-smoke matrix
        run: python3 scripts/validate_install_smoke_matrix.py
