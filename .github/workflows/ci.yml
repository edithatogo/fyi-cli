name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI has no OS keyring; use an ephemeral test-only backend.
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Record execution provenance
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/python-tests
          checked_sha="$(git rev-parse HEAD)"
          {
            printf 'event_sha=%s\nsource_head_sha=%s\ncheckout_sha=%s\nrun_id=%s\nrun_attempt=%s\nevent=%s\n' "$GITHUB_SHA" "$SOURCE_HEAD_SHA" "$checked_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"
            printf 'run_url=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            uname -a
          } > artifacts/python-tests/environment.txt

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python dependencies
        shell: bash
        run: |
          set -o pipefail
          uv --version >> artifacts/python-tests/environment.txt
          uv sync --extra dev --frozen 2>&1 | tee artifacts/python-tests/install.log
          {
            uv run python --version
            uv run pytest --version
          } >> artifacts/python-tests/environment.txt

      - name: Run Python test suite
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --junitxml=artifacts/python-tests/junit.xml 2>&1 | tee artifacts/python-tests/pytest.log

      - name: Retain Python test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/python-tests/
          if-no-files-found: error
          retention-days: 14

  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Install Python dependencies
        run: uv sync --extra dev --frozen

      - name: Run property-based suites
        run: uv run python scripts/run_property_tests.py

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Workspace Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run workspace tests
        run: cargo test --workspace --all-features

  package-smoke:
    name: Package Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Build release binary
        run: cargo build --release --locked --package fyi-cli

      - name: Smoke test binary help
        run: ./target/release/fyi-cli --help

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Record execution provenance
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/security-audit
          checked_sha="$(git rev-parse HEAD)"
          {
            printf 'event_sha=%s\nsource_head_sha=%s\ncheckout_sha=%s\nrun_id=%s\nrun_attempt=%s\nevent=%s\n' "$GITHUB_SHA" "$SOURCE_HEAD_SHA" "$checked_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"
            printf 'run_url=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            uname -a
          } > artifacts/security-audit/environment.txt

      - name: Set up qualified Python for security policy verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15.1"

      - name: Reject new or expired RustSec suppressions
        run: python scripts/verify_security_exceptions.py --require-python 3.15.1

      - name: Install cargo-audit
        shell: bash
        run: |
          set -o pipefail
          {
            rustc --version --verbose
            cargo --version
          } >> artifacts/security-audit/environment.txt
          cargo install cargo-audit --locked 2>&1 | tee artifacts/security-audit/install-audit.log
          cargo audit --version >> artifacts/security-audit/environment.txt

      - name: Install cargo-deny
        shell: bash
        run: |
          set -o pipefail
          cargo install cargo-deny --locked 2>&1 | tee artifacts/security-audit/install-deny.log
          cargo deny --version >> artifacts/security-audit/environment.txt

      - name: Run security audit
        shell: bash
        run: |
          set -o pipefail
          cargo audit \
            --ignore RUSTSEC-2026-0387 \
            --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372 2>&1 | tee artifacts/security-audit/audit.log

      - name: Run cargo-deny
        shell: bash
        run: |
          set -o pipefail
          cargo deny check 2>&1 | tee artifacts/security-audit/deny.log

      - name: Retain security audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/security-audit/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Record execution provenance
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/coverage
          checked_sha="$(git rev-parse HEAD)"
          {
            printf 'event_sha=%s\nsource_head_sha=%s\ncheckout_sha=%s\nrun_id=%s\nrun_attempt=%s\nevent=%s\n' "$GITHUB_SHA" "$SOURCE_HEAD_SHA" "$checked_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"
            printf 'run_url=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            uname -a
          } > artifacts/coverage/environment.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f7c3597aa4e6da3f315e128de702ce61e7b2877

      - name: Record coverage tool versions
        shell: bash
        run: |
          {
            rustc --version --verbose
            cargo --version
            cargo llvm-cov --version
          } >> artifacts/coverage/environment.txt

      - name: Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-

      - name: Discard stale instrumented builds
        run: rm -rf target/llvm-cov-target

      - name: Run tests with coverage
        shell: bash
        # Produce LCOV for Codecov and enforce the project target. An 83%
        # report must fail CI; 90% is a gate, not an informational goal.
        # The process-event exporter has dedicated contract/benchmark tests;
        # downstream archive consumers provide its integration coverage.
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info \
            --ignore-filename-regex '(^|/)(main|tui)\.rs$|/tor\.rs$|/jurisdiction\.rs$|/process_events\.rs$' \
            2>&1 | tee artifacts/coverage/tests.log
          cargo llvm-cov report --summary-only --fail-under-lines 90 \
            --ignore-filename-regex '(^|/)(main|tui)\.rs$|/tor\.rs$|/jurisdiction\.rs$|/process_events\.rs$' \
            2>&1 | tee artifacts/coverage/summary.log
          test -f lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: lcov.info
          fail_ci_if_error: true
          use_oidc: true
          verbose: true

      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage/
            lcov.info
          if-no-files-found: error
          retention-days: 14

  harness-contract:
    name: Layered Harness Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Isolate Rustup state
        # Avoid partially installed toolchains in the hosted runner's default home.
        shell: bash
        run: printf 'RUSTUP_HOME=%s/fyi-harness-rustup\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Rust harness toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
          components: rustfmt,clippy

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install test harness dependencies
        run: python -m pip install --upgrade uv && uv sync --extra dev --locked

      - name: Run offline harness layers
        run: uv run python scripts/verify_test_harness.py --run

  # Lightweight guard for multi-registry packaging drafts (no Rust/cargo).
  # See docs/release-multi-registry.md and scripts/verify_packaging_assets.py
  packaging-assets:
    name: Packaging Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Reject partial Rust releases
        if: github.event_name == 'pull_request'
        run: python3 scripts/verify_release_scope.py --base "${{ github.event.pull_request.base.sha }}" --head "$GITHUB_SHA"

      - name: Verify packaging assets
        run: python3 scripts/verify_packaging_assets.py

      - name: Run cross-platform release preflight
        run: python3 scripts/release_preflight.py --json

      - name: Validate registry submission ledger
        run: python3 scripts/validate_registry_submission_ledger.py

      - name: Validate AI plugin submission packets
        run: python3 scripts/validate_ai_plugin_packets.py

      - name: Validate install-smoke matrix
        run: python3 scripts/validate_install_smoke_matrix.py
