name: External Registry Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15.1"

      - name: Verify repository-local Python environment
        run: |
          python -m venv .venv
          .venv/bin/python scripts/verify_python315_runtime.py

      - name: Poll external registries
        run: .venv/bin/python scripts/check_external_registry_status.py --output registry-status.json

      - name: Comment on #32 when evidence changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fingerprint=$(jq -r '.fingerprint' registry-status.json)
          body=$(jq -r '.markdown' registry-status.json)
          prior=$(gh issue view 32 --json comments --jq '.comments[].body' 2>/dev/null || true)
          marker="<!-- registry-monitor:${fingerprint} -->"
          if ! grep -Fq "$marker" <<< "$prior"; then
            gh issue comment 32 --body "$body"
          fi

      - name: Upload monitor evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: external-registry-status
          path: registry-status.json
          if-no-files-found: error
