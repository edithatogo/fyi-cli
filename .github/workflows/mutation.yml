name: Mutation Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0"

permissions:
  contents: read

jobs:
  rust-mutants:
    name: Rust mutation analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutation analysis
        run: cargo mutants --workspace --all-features --timeout 60

  python-mutants:
    name: Python mutation analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install Python dependencies
        run: uv sync --extra dev --frozen
      - name: Run Python mutation analysis
        run: python mutation_test.py
