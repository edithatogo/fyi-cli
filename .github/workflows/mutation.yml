name: Mutation Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"

jobs:
  rust-mutants:
    name: Rust mutation analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Record execution provenance
        run: |
          mkdir -p artifacts/mutation
          {
            printf 'workflow_sha=%s\nrun_id=%s\nrun_attempt=%s\nevent=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"
            git rev-parse HEAD
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            uname -a
          } > artifacts/mutation/environment.txt
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Install cargo-mutants
        run: |
          set -o pipefail
          cargo install cargo-mutants --locked 2>&1 | tee artifacts/mutation/install.log
          {
            rustc --version
            cargo --version
            cargo mutants --version
          } >> artifacts/mutation/environment.txt
      - name: Run mutation analysis
        run: |
          set -o pipefail
          cargo mutants --workspace --all-features --timeout 60 2>&1 | tee artifacts/mutation/rust.log
      - name: Retain Rust mutation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-mutation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/mutation/
            mutants.out/
          if-no-files-found: error
          retention-days: 14

  python-mutants:
    name: Python mutation analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Record execution provenance
        run: |
          mkdir -p artifacts/mutation
          {
            printf 'workflow_sha=%s\nrun_id=%s\nrun_attempt=%s\nevent=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"
            git rev-parse HEAD
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            uname -a
          } > artifacts/mutation/environment.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install Python dependencies
        run: |
          set -o pipefail
          uv sync --extra dev --frozen 2>&1 | tee artifacts/mutation/install.log
          {
            uv --version
            uv run python --version
            uv run python -m pytest --version
          } >> artifacts/mutation/environment.txt
      - name: Run Python mutation analysis
        run: |
          set -o pipefail
          uv run python mutation_test.py --threshold 70 2>&1 | tee artifacts/mutation/python.log
      - name: Retain Python mutation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-mutation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mutation/
          if-no-files-found: error
          retention-days: 14
