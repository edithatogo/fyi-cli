name: Conda Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-conda:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12'

    - name: Install conda-build dependencies
      run: |
        conda install -c conda-forge conda-build anaconda-client -y

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=${{ github.event.inputs.version }}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Update meta.yaml with version
      run: |
        sed -i 's/{% set version = ".*" %}/{% set version = "${{ steps.version.outputs.version }}" %}/' conda/meta.yaml

    - name: Get source hash
      id: hash
      run: |
        HASH=$(curl -sL "https://pypi.org/packages/source/f/fyi-cli/fyi-cli-${{ steps.version.outputs.version }}.tar.gz" | sha256sum | cut -d' ' -f1)
        echo "hash=$HASH" >> $GITHUB_OUTPUT

    - name: Update meta.yaml with hash
      run: |
        sed -i "s/PLACEHOLDER_SHA256_HASH/${{ steps.hash.outputs.hash }}/" conda/meta.yaml

    - name: Build conda package
      run: |
        conda-build conda/ --output-folder conda-dist

    - name: Upload to Anaconda.org
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
      run: |
        anaconda upload conda-dist/noarch/fyi-cli-*.tar.bz2 || echo "Upload failed - may already exist"

    - name: Create conda-forge PR
      if: github.event_name == 'release' && !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha')
      run: |
        echo "Creating conda-forge PR (manual step)"
        echo "1. Fork https://github.com/conda-forge/fyi-cli-feedstock"
        echo "2. Update recipe in recipe/meta.yaml"
        echo "3. Submit PR to conda-forge/staged-recipes"
