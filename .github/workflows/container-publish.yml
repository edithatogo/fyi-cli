name: Container publish

# Multi-arch fyi-mcp image → ghcr.io/<owner>/fyi-mcp
# Docs: docs/containers.md
# Catalog package: packaging/mcp-catalogs/docker-mcp/

on:
  push:
    tags:
      - "fyi-mcp-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: branch/sha metadata)"
        required: false
        default: ""

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Public image name: ghcr.io/edithatogo/fyi-mcp (owner = repository_owner)
  IMAGE_NAME: fyi-mcp

jobs:
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name (lowercase for GHCR)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=fyi-mcp
            org.opencontainers.image.description=FYI request management MCP server (stdio) for Alaveteli FOI/OIA workflows
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## fyi-mcp container publish"
            echo ""
            echo "- **Image:** \`${{ steps.image.outputs.name }}\`"
            echo "- **Platforms:** linux/amd64, linux/arm64"
            echo "- **Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pull examples: see [docs/containers.md](../docs/containers.md)"
            echo ""
            echo "Do not mark GHCR **live** in the distribution matrix until a public pull succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
