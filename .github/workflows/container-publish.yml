name: Container publish

# Multi-arch fyi-mcp image → ghcr.io/<owner>/fyi-mcp
# Docs: docs/containers.md
# Release orchestration: docs/release-multi-registry.md
# Catalog package: packaging/mcp-catalogs/docker-mcp/
#
# Optional Docker Hub mirror (not required; matrix row stays "planned" until enabled):
#   Repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   Repository variable: ENABLE_DOCKERHUB_MIRROR=true
# When those are set, job dockerhub-mirror re-tags/pushes the GHCR-built image.
# Prefer proving GHCR public pull before enabling Hub.

on:
  push:
    tags:
      - "fyi-mcp-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: branch/sha metadata)"
        required: false
        default: ""

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Public image name: ghcr.io/edithatogo/fyi-mcp (owner = repository_owner)
  IMAGE_NAME: fyi-mcp

jobs:
  build-and-push:
    name: Build the multi-arch release candidate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name (lowercase for GHCR)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=fyi-mcp
            org.opencontainers.image.description=FYI request management MCP server (stdio) for Alaveteli FOI/OIA workflows
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push an unpromoted candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:rc-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Grype container (${{ matrix.arch }})
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the immutable platform manifest
        id: platform
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          INDEX_DIGEST: ${{ needs.build-and-push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/container-manifest"
          docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw > "$RUNNER_TEMP/container-manifest/index.json"
          digest="$(jq -er --arg arch "$ARCH" '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
            | if length == 1 then .[0].digest else error("Expected exactly one runtime platform manifest") end
            | select(test("^sha256:[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/container-manifest/index.json")"
          jq -n --arg image "$IMAGE" --arg index "$INDEX_DIGEST" --arg digest "$digest" --arg platform "linux/$ARCH"  \
            '{image: $image, index: $index, digest: $digest, platform: $platform}' > "$RUNNER_TEMP/container-manifest/identity.json"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - name: Enforce the critical vulnerability gate
        uses: edithatogo/repository-standards/.github/actions/grype-scan@bf6bb998414f275296dd174d459504a0c45582b5
        with:
          image: ${{ steps.platform.outputs.image }}
          platform: linux/${{ matrix.arch }}
          mode: enforce
          severity-cutoff: critical
          artifact-name: grype-container-${{ matrix.arch }}
          output-directory: ${{ runner.temp }}/grype-container-${{ matrix.arch }}
          source-sha: ${{ github.sha }}
      - name: Retain index and platform binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-manifest-${{ matrix.arch }}
          path: ${{ runner.temp }}/container-manifest
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Promote scanned multi-arch image
    needs: [build-and-push, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the scanned image without rebuilding
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
          IMAGE_TAGS: ${{ needs.build-and-push.outputs.tags }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          [ "${#args[@]}" -gt 0 ]
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$IMAGE_DIGEST"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            actual="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            [ "$actual" = "$IMAGE_DIGEST" ]
            echo "Promoted $tag@$actual" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
          echo "Do not mark GHCR live in the distribution matrix until a public pull succeeds." >> "$GITHUB_STEP_SUMMARY"

  # Optional: mirror to Docker Hub when explicitly enabled.
  # Isolated job so Hub auth/quota failures never fail the GHCR publish (needs: + continue-on-error).
  dockerhub-mirror:
    name: Optional Docker Hub mirror
    permissions:
      packages: read
    needs: [build-and-push, promote]
    if: ${{ vars.ENABLE_DOCKERHUB_MIRROR == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Require Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "ENABLE_DOCKERHUB_MIRROR=true but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are missing."
            echo "Skipping mirror (non-fatal)."
            exit 0
          fi
          echo "secrets_ok=true" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: env.secrets_ok == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: env.secrets_ok == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR (pull source)
        if: env.secrets_ok == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy multi-arch image to Docker Hub
        if: env.secrets_ok == 'true'
        env:
          SRC: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          # Mirror by digest to preserve multi-arch index; tag as user/fyi-mcp:tag lines from GHCR meta.
          # Primary: push :latest and the git tag when present.
          dest_base="${HUB_USER}/${{ env.IMAGE_NAME }}"
          src_ref="${SRC}@${DIGEST}"
          echo "Mirroring ${src_ref} → ${dest_base}"
          # Use buildx imagetools to copy without rebuild (low risk / no QEMU rebuild).
          docker buildx imagetools create --prefer-index=false --tag "${dest_base}:latest" "${src_ref}"
          # Also tag matching the Git ref when this is a version tag
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag_name="${GITHUB_REF#refs/tags/}"
            docker buildx imagetools create --prefer-index=false --tag "${dest_base}:${tag_name}" "${src_ref}"
          fi
          echo "Docker Hub mirror attempted for ${dest_base}"
