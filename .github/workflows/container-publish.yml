name: Container publish

# Multi-arch fyi-mcp image → ghcr.io/<owner>/fyi-mcp
# Docs: docs/containers.md
# Release orchestration: docs/release-multi-registry.md
# Catalog package: packaging/mcp-catalogs/docker-mcp/
#
# Optional Docker Hub mirror (not required; matrix row stays "planned" until enabled):
#   Repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   Repository variable: ENABLE_DOCKERHUB_MIRROR=true
# When those are set, job dockerhub-mirror re-tags/pushes the GHCR-built image.
# Prefer proving GHCR public pull before enabling Hub.

on:
  push:
    tags:
      - "fyi-mcp-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: branch/sha metadata)"
        required: false
        default: ""

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Public image name: ghcr.io/edithatogo/fyi-mcp (owner = repository_owner)
  IMAGE_NAME: fyi-mcp

jobs:
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name (lowercase for GHCR)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=fyi-mcp
            org.opencontainers.image.description=FYI request management MCP server (stdio) for Alaveteli FOI/OIA workflows
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## fyi-mcp container publish"
            echo ""
            echo "- **Image:** \`${{ steps.image.outputs.name }}\`"
            echo "- **Platforms:** linux/amd64, linux/arm64"
            echo "- **Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pull examples: see [docs/containers.md](../docs/containers.md)"
            echo ""
            echo "Do not mark GHCR **live** in the distribution matrix until a public pull succeeds."
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional: mirror to Docker Hub when explicitly enabled.
  # Isolated job so Hub auth/quota failures never fail the GHCR publish (needs: + continue-on-error).
  dockerhub-mirror:
    name: Optional Docker Hub mirror
    needs: build-and-push
    if: ${{ vars.ENABLE_DOCKERHUB_MIRROR == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Require Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "ENABLE_DOCKERHUB_MIRROR=true but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are missing."
            echo "Skipping mirror (non-fatal)."
            exit 0
          fi
          echo "secrets_ok=true" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: env.secrets_ok == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.secrets_ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR (pull source)
        if: env.secrets_ok == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy multi-arch image to Docker Hub
        if: env.secrets_ok == 'true'
        env:
          SRC: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          # Mirror by digest to preserve multi-arch index; tag as user/fyi-mcp:tag lines from GHCR meta.
          # Primary: push :latest and the git tag when present.
          dest_base="${HUB_USER}/${{ env.IMAGE_NAME }}"
          src_ref="${SRC}@${DIGEST}"
          echo "Mirroring ${src_ref} → ${dest_base}"
          # Use buildx imagetools to copy without rebuild (low risk / no QEMU rebuild).
          docker buildx imagetools create --tag "${dest_base}:latest" "${src_ref}"
          # Also tag matching the Git ref when this is a version tag
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag_name="${GITHUB_REF#refs/tags/}"
            docker buildx imagetools create --tag "${dest_base}:${tag_name}" "${src_ref}"
          fi
          echo "Docker Hub mirror attempted for ${dest_base}"
