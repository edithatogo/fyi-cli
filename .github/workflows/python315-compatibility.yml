name: Python 3.15 migration compatibility

on:
  pull_request:
    branches: [master]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - ".github/workflows/python315-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-315:
    name: Python 3.15 compatibility sensor (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Validate frozen lock, install, and tests
        shell: bash
        run: |
          set +e
          uv sync --python 3.15 --extra dev --frozen > python315.log 2>&1
          install_status=$?
          test_status=99
          if [ "$install_status" -eq 0 ]; then
            uv run --python 3.15 pytest -q >> python315.log 2>&1
            test_status=$?
          fi
          printf 'install_exit=%s\ntest_exit=%s\n' "$install_status" "$test_status" | tee python315-status.txt
          cat python315.log
          # Sensor intentionally does not block existing supported Python 3.11/3.12.
          # Never change requires-python until this and the security dependencies pass.
          exit 0
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python315-compatibility
          path: |
            python315.log
            python315-status.txt
          if-no-files-found: warn
          retention-days: 14
