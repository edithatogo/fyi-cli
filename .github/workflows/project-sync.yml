name: GitHub Project Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync-riopa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check project sync token
        env:
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
        run: |
          if [ -z "$PROJECT_SYNC_TOKEN" ]; then
            echo "PROJECT_SYNC_TOKEN is required for user-level GitHub ProjectsV2 writes."
            echo "Create a token with the GitHub CLI 'project' scope and store it as a repository secret."
            exit 1
          fi

      - name: Sync fyi-cli roadmap into RIOPA
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
        run: |
          python scripts/sync_github_projects.py
