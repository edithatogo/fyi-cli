name: GitHub Project Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-riopa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check project sync token
        env:
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
        run: |
          if [ -z "$PROJECT_SYNC_TOKEN" ]; then
            echo "PROJECT_SYNC_TOKEN is required for user-level GitHub ProjectsV2 writes."
            echo "Create a token with the GitHub CLI 'project' scope and store it as a repository secret."
            exit 1
          fi

      - name: Select pinned Python 3.15.1
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15.1"

      - name: Verify repository-local Python environment
        run: |
          python -m venv .venv
          .venv/bin/python scripts/verify_python315_runtime.py

      - name: Sync fyi-cli roadmap into RIOPA
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
        run: |
          .venv/bin/python scripts/sync_github_projects.py
