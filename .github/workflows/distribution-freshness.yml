name: Distribution Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  evidence:
    name: Check public distribution evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check evidence URLs
        run: python3 scripts/check_distribution_freshness.py --strict --output distribution-freshness.json

      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-freshness
          path: distribution-freshness.json
          if-no-files-found: error
