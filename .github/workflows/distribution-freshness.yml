name: Distribution Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evidence:
    name: Check public distribution evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select pinned Python 3.15.1
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15.1"

      - name: Verify repository-local Python environment
        run: |
          python -m venv .venv
          .venv/bin/python scripts/verify_python315_runtime.py

      - name: Check evidence URLs
        run: .venv/bin/python scripts/check_distribution_freshness.py --strict --output distribution-freshness.json

      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distribution-freshness
          path: distribution-freshness.json
          if-no-files-found: error
