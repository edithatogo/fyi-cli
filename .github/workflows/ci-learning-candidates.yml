name: CI Learning Candidates

on:
  workflow_run:
    workflows:
      - "Docs Lint"
      - "CI"
      - "CodeQL"
      - "Release"
      - "Release Please"
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'action_required' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select pinned Python 3.15.1
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15.1"

      - name: Verify repository-local Python environment
        run: |
          python -m venv .venv
          .venv/bin/python scripts/verify_python315_runtime.py

      - name: Record CI failure candidate
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          .venv/bin/python scripts/record_learning_candidate.py \
            --backlog .conductor/improvement-backlog.md \
            --snapshot ".conductor/.tmp/ci-learning-candidates-${WORKFLOW_RUN_ID}.md" \
            --message "CI failure summary candidate for ${WORKFLOW_NAME}" \
            --evidence "workflow=${WORKFLOW_NAME}" \
            --evidence "run_id=${WORKFLOW_RUN_ID}" \
            --evidence "run_url=${WORKFLOW_RUN_URL}" \
            --evidence "actor=${WORKFLOW_ACTOR}" \
            --evidence "head_sha=${WORKFLOW_HEAD_SHA}"

      - name: Upload non-committing learning candidate artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ci-learning-candidates-${{ github.event.workflow_run.id }}
          path: .conductor/.tmp/ci-learning-candidates-${{ github.event.workflow_run.id }}.md
