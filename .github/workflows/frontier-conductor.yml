name: Frontier Conductor and MSRV contracts

on:
  pull_request:
    branches: [master]
    paths:
      - ".conductor/**"
      - "crates/**/Cargo.toml"
      - "rust-toolchain.toml"
      - "scripts/verify_frontier_conductor.py"
      - "tests/test_frontier_conductor.py"
      - "scripts/verify_cli_parity.py"
      - "conformance/cli/**"
      - "scripts/verify_foi_platform_landscape.py"
      - "tests/test_foi_platform_landscape.py"
      - "conformance/providers/foi-platform-landscape-v1.json"
      - "scripts/verify_foi_source_snapshots.py"
      - "tests/test_foi_source_snapshots.py"
      - "conformance/providers/foi-source-baseline-v1.json"
      - "crates/fyi-core/src/sync/documentation.rs"
      - "crates/fyi-core/examples/observe_platform_docs.rs"
      - "docs/foi-platform-landscape.md"
      - "src/fyi_system/cli.py"
      - "crates/fyi-cli/src/main.rs"
      - ".github/workflows/frontier-conductor.yml"
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract:
    name: Conductor contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15.2"

      - name: Establish repository-local Python 3.15.2
        run: |
          python -m venv .venv
          .venv/bin/python scripts/verify_python315_runtime.py
      - name: Conductor contract and migration inventory
        run: .venv/bin/python scripts/verify_frontier_conductor.py --json --inventory
      - name: Verify command-name parity baseline
        run: .venv/bin/python scripts/verify_cli_parity.py
      - name: Verify reviewed FOI platform landscape offline
        run: .venv/bin/python scripts/verify_foi_platform_landscape.py
      - name: Validate reviewed documentation metadata offline
        run: .venv/bin/python scripts/verify_foi_source_snapshots.py
      - name: Offline regression tests
        run: |
          .venv/bin/python -m pip install pytest
          .venv/bin/python -m pytest -q tests/test_frontier_conductor.py tests/test_foi_platform_landscape.py tests/test_foi_source_snapshots.py

  rust-msrv:
    name: Rust 1.99.1 MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install MSRV compiler
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Version evidence
        run: cargo +1.99.1 --version && rustc +1.99.1 --version
      - name: Verify workspace on declared MSRV
        run: |
          cargo +1.99.1 fmt --all -- --check
          cargo +1.99.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo +1.99.1 test --workspace --all-features --locked
          cargo +1.99.1 test --locked --package fyi-core --example observe_platform_docs
          cargo +1.99.1 run --locked --package fyi-cli -- verify-acquisition-receipt conformance/acquisition/receipt-v1-python.json
          cargo +1.99.1 run --locked --package fyi-cli -- verify-acquisition-receipt conformance/acquisition/receipt-v1-python.json --result-file conformance/acquisition/result-v1.json
          cargo +1.99.1 run --locked --package fyi-cli -- verify-acquisition-receipt conformance/acquisition/receipt-v1-python.json --raw-file conformance/acquisition/raw-v1.bin
          cargo +1.99.1 run --locked --package fyi-cli -- verify-acquisition-receipt conformance/acquisition/receipt-v1-python.json --result-file conformance/acquisition/result-v1.json --raw-file conformance/acquisition/raw-v1.bin
          printf 'tampered-raw' > tampered-raw.bin
          if cargo +1.99.1 run --locked --package fyi-cli -- verify-acquisition-receipt conformance/acquisition/receipt-v1-python.json --raw-file tampered-raw.bin; then
            echo "Corrupted raw HTTP body unexpectedly verified" >&2
            exit 1
          fi
          printf 'tampered-result\n' > tampered-result.txt
          if cargo +1.99.1 run --locked --package fyi-cli -- verify-acquisition-receipt conformance/acquisition/receipt-v1-python.json --result-file tampered-result.txt; then
            echo "Corrupted result unexpectedly verified" >&2
            exit 1
          fi
      - name: Build documentation observer for operator-controlled captures
        run: |
          cargo +1.99.1 build --locked --package fyi-core --example observe_platform_docs
          mkdir -p artifacts/documentation-observer
          cp target/debug/examples/observe_platform_docs artifacts/documentation-observer/
          git rev-parse HEAD > artifacts/documentation-observer/revision.txt
          rustc +1.99.1 --version > artifacts/documentation-observer/toolchain.txt
          cd artifacts/documentation-observer
          sha256sum observe_platform_docs > SHA256SUMS
      - name: Retain compiled observer without contacting documentation sources
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: documentation-observer-${{ github.sha }}
          path: artifacts/documentation-observer/
          if-no-files-found: error
          retention-days: 7
