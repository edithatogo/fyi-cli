name: Receipt portability

on:
  pull_request:
    branches: [master]
    paths:
      - "crates/fyi-core/**"
      - "crates/fyi-cli/**"
      - "conformance/acquisition/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/receipt-portability.yml"
      - "tests/test_receipt_portability_workflow.py"
  push:
    branches: [master]
    paths:
      - "crates/fyi-core/**"
      - "crates/fyi-cli/**"
      - "conformance/acquisition/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/receipt-portability.yml"
      - "tests/test_receipt_portability_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receipt-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  receipts:
    name: Receipt portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record source and toolchain evidence
        run: |
          mkdir -p artifacts/receipt-portability
          {
            git rev-parse HEAD
            printf 'runner_os=%s\nrunner_arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            rustc --version --verbose
            cargo --version
          } | tee artifacts/receipt-portability/environment.txt
      - name: Cache Cargo dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: receipt-portability-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/workflows/receipt-portability.yml') }}
      - name: Verify receipt publication and core contracts
        run: |
          set -o pipefail
          cargo test --locked --package fyi-core \
            --test acquisition_receipts \
            --test acquisition_receipt_numeric_conformance \
            --test acquisition_receipt_midpoint_conformance \
            --test receipt_wire \
            --test receipt_persistence_portability \
            2>&1 | tee artifacts/receipt-portability/core-tests.log
      - name: Verify actual CLI receipt ingestion
        run: |
          set -o pipefail
          cargo test --locked --package fyi-cli \
            --test receipt_numeric_tests --test receipt_wire_tests \
            2>&1 | tee artifacts/receipt-portability/cli-tests.log
      - name: Retain portability evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: receipt-portability-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/receipt-portability/
          if-no-files-found: error
          retention-days: 14
