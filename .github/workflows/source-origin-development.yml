name: Source origin development verification

on:
  push:
    branches: [fix/source-origin-boundary-309]
    paths:
      - .github/workflows/source-origin-development.yml
      - crates/fyi-core/src/sync_source_origin_regression.rs

permissions:
  contents: read

concurrency:
  group: source-origin-development-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: source-origin-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Register regression against unchanged implementation
        run: |
          mkdir -p artifacts/source-origin candidate-files
          rustc --version
          node --version
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path = 'crates/fyi-core/src/sync.rs';
          const bytes = fs.readFileSync(path);
          const sha = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          if (sha !== '9278eb59d6234e223f14aefc9ccf6d1bfe6eed0d') throw new Error('source checkpoint changed; reconcile before applying');
          fs.appendFileSync(path, '\n#[cfg(test)]\n#[path = "sync_source_origin_regression.rs"]\nmod source_origin_regression;\n');
          JS
      - name: Observe runtime regression before implementation
        run: |
          set +e
          cargo test --locked -p fyi-core --lib source_origin_regression -- --nocapture > artifacts/source-origin/red.log 2>&1
          result=$?
          set -e
          cat artifacts/source-origin/red.log
          test "$result" -eq 101
          grep -q 'test result: FAILED' artifacts/source-origin/red.log
          grep -q 'cross_origin_never_receives_bot_header.*FAILED' artifacts/source-origin/red.log
          grep -q 'origin_rejection_precedes_token_parsing.*FAILED' artifacts/source-origin/red.log
          if grep -q 'could not compile' artifacts/source-origin/red.log; then exit 1; fi
      - name: Apply origin check before credentials and side effects
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path = 'crates/fyi-core/src/sync.rs';
          const text = fs.readFileSync(path, 'utf8');
          const anchor = '        let cache_key = request.url().to_string();';
          if (text.split(anchor).length !== 2) throw new Error('non-unique origin guard insertion point');
          const guard = [
            '        if request.url().origin() != self.base_url.origin() {',
            '            return Err(anyhow!("outbound request violates configured source origin policy"));',
            '        }',
            anchor,
          ].join('\n');
          fs.writeFileSync(path, text.replace(anchor, guard));
          JS
          cargo fmt -p fyi-core
      - name: Verify green regression and existing sync contracts
        run: |
          set -o pipefail
          cargo test --locked -p fyi-core --lib sync:: 2>&1 | tee artifacts/source-origin/green.log
          cargo clippy --locked -p fyi-core --all-targets --all-features -- -D warnings 2>&1 | tee artifacts/source-origin/clippy.log
          git diff --check
      - name: Export only allowlisted candidate files
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const doc = '.conductor/tracks/source-adapter-boundary-20260812/initial-origin-boundary.md';
          fs.appendFileSync(doc, `\nHosted red/green development evidence: https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\nSource preparation checkpoint: ${process.env.GITHUB_SHA}.\nNormal final-head protected-branch CI remains required before merging.\n`);
          const paths = ['crates/fyi-core/src/sync.rs', 'crates/fyi-core/src/sync_source_origin_regression.rs', doc];
          const entries = paths.map((path, index) => {
            const data = fs.readFileSync(path);
            fs.writeFileSync(`candidate-files/${index}`, data);
            return {path, file: String(index), size: data.length, sha256: crypto.createHash('sha256').update(data).digest('hex')};
          });
          fs.writeFileSync('candidate-files/manifest.json', JSON.stringify({parent: process.env.GITHUB_SHA, entries}));
          JS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: source-origin-red-green-evidence
          path: artifacts/source-origin/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: source-origin-candidate
          path: candidate-files/
          if-no-files-found: error
          retention-days: 2
  prepare-object:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: source-origin-candidate
          path: candidate-files
      - name: Create reviewable commit object without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const repo = process.env.GITHUB_REPOSITORY;
          const parent = process.env.GITHUB_SHA;
          if (repo !== 'edithatogo/fyi-cli' || process.env.GITHUB_REF !== 'refs/heads/fix/source-origin-boundary-309') throw new Error('unexpected repository or ref');
          if (!/^[0-9a-f]{40}$/.test(parent)) throw new Error('invalid parent');
          const allowed = ['crates/fyi-core/src/sync.rs', 'crates/fyi-core/src/sync_source_origin_regression.rs', '.conductor/tracks/source-adapter-boundary-20260812/initial-origin-boundary.md'];
          const manifest = JSON.parse(fs.readFileSync('candidate-files/manifest.json', 'utf8'));
          if (manifest.parent !== parent || manifest.entries.length !== allowed.length) throw new Error('unexpected manifest');
          async function api(path, method = 'GET', body) {
            const result = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method,
              headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            if (!result.ok) throw new Error(`Git object request failed with HTTP ${result.status}`);
            return result.json();
          }
          const tree = [];
          for (const [index, entry] of manifest.entries.entries()) {
            if (entry.path !== allowed[index] || entry.file !== String(index) || entry.size > 500000) throw new Error('candidate outside allowlist');
            const data = fs.readFileSync(`candidate-files/${index}`);
            if (data.length !== entry.size || crypto.createHash('sha256').update(data).digest('hex') !== entry.sha256) throw new Error('candidate integrity mismatch');
            const blob = await api('git/blobs', 'POST', {content: data.toString('base64'), encoding: 'base64'});
            tree.push({path: entry.path, mode: '100644', type: 'blob', sha: blob.sha});
          }
          tree.push({path: '.github/workflows/source-origin-development.yml', mode: '100644', type: 'blob', sha: null});
          const baseline = await api(`git/commits/${parent}`);
          const resultTree = await api('git/trees', 'POST', {base_tree: baseline.tree.sha, tree});
          const commit = await api('git/commits', 'POST', {message: 'fix(source): reject initial cross-origin requests before credential attachment', tree: resultTree.sha, parents: [parent]});
          console.log(`CANDIDATE_COMMIT=${commit.sha}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Candidate commit: ${commit.sha}\n\nNo branch ref was changed. Review this diff and run normal final-head PR checks before merging.\n`);
          JS
