name: Offline AI security
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  offline-ai-security:
    uses: edithatogo/repository-standards/.github/workflows/reusable-ai-sec-pipeline.yml@36362fa872e4ce747266a6e795fcefa3dd343f67
    permissions:
      contents: read
    with:
      enforce_ai: false
