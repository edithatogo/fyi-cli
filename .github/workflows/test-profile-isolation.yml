name: Test profile isolation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  keyring-isolation:
    name: Keyring isolation (4 workers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15.1"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install frozen development dependencies
        run: |
          uv sync --python 3.15.1 --extra dev --frozen
          uv run --no-sync --python 3.15.1 python scripts/verify_python315_runtime.py
          uv run --no-sync --python 3.15.1 python scripts/verify_python315_runtime.py
      - name: Verify isolated credential suites with bounded workers
        run: >-
          uv run pytest -q -n 4
          tests/test_credentials.py tests/test_encryption.py tests/test_keyring_isolation.py
