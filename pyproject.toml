[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyi-cli"
version = "1.2.1"
description = "Privacy-focused CLI tool for managing FYI.org.nz official information requests"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "FYI CLI Contributors", email = "support@fyi-cli.example.com"}
]
license = {text = "MIT"}
keywords = [
  "fyi",
  "alaveteli",
  "official-information",
  "oia",
  "transparency",
  "cli",
  "privacy",
  "new-zealand"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "pydantic>=2.7.0",
  "fastmcp>=0.1.0",
  "feedparser>=6.0.11",
  "jinja2>=3.1.4",
  "jsonschema>=4.23.0",
  "warcio>=1.7.4",
  "cryptography>=41.0.0",
  "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-benchmark>=4.0.0",
  "keyrings.alt>=5.0.0",
  "hypothesis>=6.100.0",
  "ruff>=0.6.0",
  "basedpyright>=1.13.0",
  "pip-audit>=2.0.0",
  "safety>=2.0.0",
  "scalene>=1.5.0",
  "uv>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/edithatogo/fyi-cli"
Documentation = "https://fyi-cli.readthedocs.io/"
Repository = "https://github.com/edithatogo/fyi-cli.git"
Issues = "https://github.com/edithatogo/fyi-cli/issues"
Changelog = "https://github.com/edithatogo/fyi-cli/blob/main/CHANGELOG.md"

[project.scripts]
fyi = "fyi_system.cli:main"
fyi-cli = "fyi_system.cli:main"
fyi-system = "fyi_system.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fyi_system = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
  "smoke: opt-in live smoke tests that contact FYI.org.nz",
  "unit: fast isolated tests",
  "integration: tests spanning multiple local components",
  "e2e: end-to-end CLI or workflow tests",
  "property: property-based or generative tests",
  "edge: malformed, boundary, and adversarial input tests",
  "performance: benchmark and load tests",
  "security: security and privacy tests",
  "compatibility: external/API compatibility tests",
  "usability: operator-facing behavior tests",
  "regression: tests for previously fixed defects",
  "sanity: release and basic health checks",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", ".eggs"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "N",      # pep8-naming
  "YTT",    # flake8-2020
  "S",      # flake8-bandit (security)
  "BLE",    # flake8-blind-except
  "FBT",    # flake8-boolean-trap
  "B9",     # flake8-bugbear opinions
  "A",      # flake8-builtins
  "COM",    # flake8-commas
  "C90",    # mccabe complexity
  "DTZ",    # flake8-datetimez
  "T10",    # flake8-debugger
  "DJ",     # flake8-django
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "ISC",    # flake8-implicit-str-concat
  "ICN",    # flake8-import-conventions
  "G",      # flake8-logging-format
  "INP",    # flake8-no-pep420
  "PIE",    # flake8-pie
  "T20",    # flake8-print
  "PYI",    # flake8-pyi
  "PT",     # flake8-pytest-style
  "Q",      # flake8-quotes
  "RSE",    # flake8-raise
  "RET",    # flake8-return
  "SLF",    # flake8-self
  "SLOT",   # flake8-slots
  "SIM",    # flake8-simplify
  "TID",    # flake8-tidy-imports
  "TCH",    # flake8-type-checking
  "INT",    # flake8-gettext
  "ARG",    # flake8-unused-arguments
  "PTH",    # flake8-use-pathlib
  "TD",     # flake8-todos
  "ERA",    # eradicate (commented-out code)
  "PD",     # pandas-vet
  "PGH",    # pygrep-hooks
  "PL",     # pylint
  "TRY",    # tryceratops
  "FLY",    # flynt
  "NPY",    # NumPy-specific rules
  "AIR",    # Airflow
  "PERF",   # Perflint
  "FURB",   # refurb
  "RUF",    # Ruff-specific rules
]
ignore = [
  "PLR",    # Design related pylint codes (too many arguments, etc.)
  "D",      # pydocstyle (use docstring conventions separately)
  "ANN",    # flake8-annotations (covered by pyright)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",   # Allow assert in tests
  "PLR2004",# Allow magic values in tests
  "S311",   # Allow random in tests
]

[tool.ruff.lint.isort]
known-first-party = ["fyi_system"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 10
max-statements = 60

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["**/__pycache__", "build", "dist", ".eggs"]
reportMissingTypeStubs = false
reportAttributeAccessIssue = false
reportIncompatibleMethodOverride = false
reportMissingParameterType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportPrivateUsage = false
reportUntypedFunctionDecorator = false
reportUnnecessaryIsInstance = false
reportUnnecessaryCast = false
reportUnusedFunction = true
reportUnusedClass = true
reportUnusedImport = true
reportDuplicateImport = true
reportConstantRedefinition = true
reportOverlappingOverload = true
reportUninitializedInstanceVariable = false
reportInvalidTypeForm = false
reportMissingModuleSource = false

# BasedPyright specific (stricter checks)
reportImplicitStringConcatenation = true
reportInconsistentConstructor = true
reportMissingSuperCall = true
reportUnreachable = true
