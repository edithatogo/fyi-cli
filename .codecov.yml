# Codecov config for the Rust-first fyi-cli workspace.
# Local/CI target: >=90% line coverage via cargo-llvm-cov (see PATH_TO_95_COVERAGE.md).

coverage:
  status:
    project:
      default:
        # Enforce the documented 90% workspace target on the default branch.
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        # New code should not land largely untested.
        target: 90%
        threshold: 0%
        informational: false

ignore:
  - "tests/**"
  - "crates/**/tests/**"
  - "**/examples/**"
  - "dashboard/**"
  - "docs-site/**"
  - "src/fyi_system/**"  # legacy Python package; not the Rust release gate
