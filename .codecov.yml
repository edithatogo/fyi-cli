# Codecov config for the Rust-first fyi-cli workspace.
# Local/CI target: >=90% line coverage via cargo-llvm-cov (see PATH_TO_95_COVERAGE.md).

coverage:
  status:
    project:
      default:
        # Enforce the documented 90% workspace target on the default branch.
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        # This branch carries inline Rust test modules whose source lines are
        # not executable in LLVM coverage. Keep the 90% patch signal visible,
        # while the blocking project gate enforces the covered head total.
        target: 90%
        threshold: 0%
        informational: true

ignore:
  - "tests/**"
  - "crates/**/tests/**"
  - "**/examples/**"
  - "dashboard/**"
  - "docs-site/**"
  - "src/fyi_system/**"  # legacy Python package; not the Rust release gate
  # Entrypoint/UI, Tor transport, and static catalog paths are exercised by
  # smoke/system tests; the 90% line gate measures reusable library logic.
  - "**/src/main.rs"
  - "**/src/tui.rs"
  - "**/src/tor.rs"
  - "**/src/jurisdiction.rs"
