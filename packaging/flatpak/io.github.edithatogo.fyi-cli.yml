{
  "app-id": "io.github.edithatogo.fyi-cli",
  "runtime": "org.freedesktop.Platform",
  "runtime-version": "25.08",
  "sdk": "org.freedesktop.Sdk",
  "sdk-extensions": [
    "org.freedesktop.Sdk.Extension.rust-stable"
  ],
  "command": "fyi-cli",
  "finish-args": [
    "--share=network"
  ],
  "build-options": {
    "append-path": "/usr/lib/sdk/rust-stable/bin",
    "env": {
      "CARGO_HOME": "/run/build/fyi-cli/cargo"
    }
  },
  "modules": [
    {
      "name": "fyi-cli",
      "buildsystem": "simple",
      "build-commands": [
        "test -d vendor",
        "test -f cargo-config.toml",
        "install -Dm644 cargo-config.toml .cargo/vendor-config.toml",
        "cargo --config .cargo/vendor-config.toml build --frozen --release --package fyi-cli --package fyi-mcp",
        "cargo --config .cargo/vendor-config.toml test --frozen --release --package fyi-cli --package fyi-mcp",
        "install -Dm755 target/release/fyi-cli /app/bin/fyi-cli",
        "install -Dm755 target/release/fyi-mcp /app/bin/fyi-mcp",
        "install -Dm644 LICENSE /app/share/licenses/fyi-cli/LICENSE",
        "install -Dm644 io.github.edithatogo.fyi-cli.metainfo.xml /app/share/metainfo/io.github.edithatogo.fyi-cli.metainfo.xml"
      ],
      "sources": [
        {
          "type": "archive",
          "url": "https://github.com/edithatogo/fyi-cli/archive/86fcbd8914037735b6f27e5a329d5f3013033efd.tar.gz",
          "sha256": "@SOURCE_SHA256@"
        },
        {
          "type": "archive",
          "path": "fyi-cli-0.1.2-vendor.tar.gz",
          "strip-components": 0,
          "sha256": "@CARGO_VENDOR_SHA256@"
        },
        {
          "type": "file",
          "path": "io.github.edithatogo.fyi-cli.metainfo.xml"
        }
      ]
    }
  ]
}
