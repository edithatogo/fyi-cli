{
  "name": "fyi-cli",
  "base": "core22",
  "version": "0.1.2",
  "summary": "Privacy-focused multi-jurisdiction FOI/OIA CLI for Alaveteli",
  "description": "fyi-cli tracks Freedom of Information / Official Information requests\nagainst Alaveteli-based platforms. Includes the fyi-cli command and\ncompanion fyi-mcp server, optional Tor routing, and local SQLite storage.\n",
  "grade": "devel",
  "confinement": "strict",
  "license": "MIT",
  "website": "https://github.com/edithatogo/fyi-cli",
  "contact": "https://github.com/edithatogo/fyi-cli/issues",
  "source-code": "https://github.com/edithatogo/fyi-cli",
  "issues": "https://github.com/edithatogo/fyi-cli/issues",
  "architectures": [
    {
      "build-on": "amd64"
    },
    {
      "build-on": "arm64"
    }
  ],
  "apps": {
    "fyi-cli": {
      "command": "bin/fyi-cli",
      "plugs": [
        "network"
      ]
    },
    "fyi-mcp": {
      "command": "bin/fyi-mcp",
      "plugs": [
        "network",
        "network-bind"
      ]
    }
  },
  "parts": {
    "vendor": {
      "plugin": "dump",
      "source": "fyi-cli-0.1.2-vendor.tar.gz",
      "source-type": "tar",
      "source-checksum": "sha256/@CARGO_VENDOR_SHA256@",
      "prime": [
        "-*"
      ]
    },
    "fyi-cli": {
      "after": [
        "vendor",
        "rust-toolchain"
      ],
      "plugin": "nil",
      "source": "https://github.com/edithatogo/fyi-cli/archive/86fcbd8914037735b6f27e5a329d5f3013033efd.tar.gz",
      "source-type": "tar",
      "source-checksum": "sha256/@SOURCE_SHA256@",
      "build-packages": [
        "pkg-config",
        "libssl-dev",
        "build-essential"
      ],
      "stage-packages": [
        "ca-certificates",
        "libssl3"
      ],
      "override-build": "set -eu\nrust_prefix=\"${CRAFT_STAGE}/rust-toolchain\"\ntest -x \"${rust_prefix}/bin/rustc\"\ntest -x \"${rust_prefix}/bin/cargo\"\ntest -f \"${CRAFT_STAGE}/toolchain-version\"\ntest -f \"${CRAFT_STAGE}/toolchain-target\"\ncase \"${CRAFT_ARCH_BUILD_FOR}\" in\n  amd64) rust_target=x86_64-unknown-linux-gnu ;;\n  arm64) rust_target=aarch64-unknown-linux-gnu ;;\n  *) printf '%s\\n' 'Unsupported offline Rust toolchain architecture' >&2; exit 1 ;;\nesac\nexport PATH=\"${rust_prefix}/bin:${PATH}\"\nexport RUSTC=\"${rust_prefix}/bin/rustc\"\nexport CARGO_NET_OFFLINE=true\ntest \"$(command -v cargo)\" = \"${rust_prefix}/bin/cargo\"\nrust_details=\"$(\"${RUSTC}\" -vV)\"\nrust_release=\"$(printf '%s\\n' \"${rust_details}\" | sed -n 's/^release: //p')\"\nrust_host=\"$(printf '%s\\n' \"${rust_details}\" | sed -n 's/^host: //p')\"\nprintf '%s\\n' \"${rust_release}\" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+$'\ntest \"${rust_release}\" = \"$(cat \"${CRAFT_STAGE}/toolchain-version\")\"\ntest \"${rust_host}\" = \"${rust_target}\"\ntest \"$(cat \"${CRAFT_STAGE}/toolchain-target\")\" = \"${rust_target}\"\ndpkg --compare-versions \"${rust_release}\" ge 1.88.0\ncargo_release=\"$(cargo --version | awk '{print $2}')\"\ntest \"${cargo_release}\" = \"${rust_release}\"\ntest -d \"${CRAFT_STAGE}/vendor\"\ntest -f \"${CRAFT_STAGE}/cargo-config.toml\"\ncp -a \"${CRAFT_STAGE}/vendor\" vendor\ninstall -Dm644 \"${CRAFT_STAGE}/cargo-config.toml\" .cargo/vendor-config.toml\ncargo --config .cargo/vendor-config.toml build --frozen --release --package fyi-cli --package fyi-mcp\ncargo --config .cargo/vendor-config.toml test --frozen --release --package fyi-cli --package fyi-mcp\ninstall -Dm755 target/release/fyi-cli \"${CRAFT_PART_INSTALL}/bin/fyi-cli\"\ninstall -Dm755 target/release/fyi-mcp \"${CRAFT_PART_INSTALL}/bin/fyi-mcp\"\n"
    },
    "rust-toolchain": {
      "plugin": "dump",
      "source": "fyi-cli-rust-toolchain.tar.gz",
      "source-type": "tar",
      "source-checksum": "sha256/@RUST_TOOLCHAIN_SHA256@",
      "prime": [
        "-*"
      ]
    }
  }
}
