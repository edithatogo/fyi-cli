# Canonical disabled policy, mirrored in the two binary crate manifests.
# fyi-cli/fyi-core names are occupied and project ownership is unverified; no qualified CLI/MCP
# assets match the current component tag. Never treat an MCPB ZIP as a binary.
# A release operator must choose/verify crate identities and immutable archives
# before replacing this policy with per-target URL/format/bin-dir metadata.
# Operator-supplied --strategies can override this upstream Binstall safeguard.
# https://github.com/cargo-bins/cargo-binstall/blob/e93a9f89058afc12903de4d5c3696de365b7fe36/SUPPORT.md

[package.metadata.binstall]
disabled-strategies = ["crate-meta-data", "quick-install", "compile"]
