[workspace]
resolver = "2"
members = [
    "crates/fyi-core",
    "crates/fyi-cli",
    "crates/fyi-mcp"
]

[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI
cargo-dist-version = "0.14.0"
# CI backends to support
ci = ["github"]
# The installers to generate for each release
installers = ["shell", "powershell"]
# Target platforms to build for
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

