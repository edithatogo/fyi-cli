[package]
name = "fyi-mcp"
version = "0.1.2"
edition = "2021"
rust-version = "1.99"
description = "MCP server for FYI request management"
license = "MIT"
repository = "https://github.com/edithatogo/fyi-cli"
readme = "README.md"

# Public binstall is blocked until crate identity and release assets are qualified.
# See packaging/cargo-binstall/metadata.toml and packaging/SUBMISSION_RUNBOOK.md.
[package.metadata.binstall]
disabled-strategies = ["crate-meta-data", "quick-install", "compile"]

[dependencies]
axum = "0.7"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fyi-core = { version = "0.1.2", path = "../fyi-core" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"

