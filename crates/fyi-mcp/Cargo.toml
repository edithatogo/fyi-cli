[package]
name = "fyi-mcp"
version = "0.1.2"
edition = "2021"
description = "MCP server for FYI request management"
license = "MIT"
repository = "https://github.com/edithatogo/fyi-cli"
readme = "README.md"

# cargo-binstall resolution hints (see packaging/cargo-binstall/metadata.toml)
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/fyi-mcp-v{ version }/fyi-mcp-{ version }-win32.mcpb"
pkg-fmt = "bin"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fyi-core = { version = "0.1.2", path = "../fyi-core" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

