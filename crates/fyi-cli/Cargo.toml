[package]
name = "fyi-cli"
version = "0.1.2"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/edithatogo/fyi-cli"
description = "Multi-jurisdiction FOI/Alaveteli request management CLI"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29"
fyi-core = { version = "0.1.2", path = "../fyi-core" }
dhat = { version = "0.3.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }

[features]
dhat-on = ["dep:dhat"]

# Public binstall is blocked until crate identity and release assets are qualified.
# See packaging/cargo-binstall/metadata.toml and packaging/SUBMISSION_RUNBOOK.md.
[package.metadata.binstall]
disabled-strategies = ["crate-meta-data", "quick-install", "compile"]
