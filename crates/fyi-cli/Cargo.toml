[package]
name = "fyi-cli"
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/edithatogo/fyi-cli"
description = "Multi-jurisdiction FOI/Alaveteli request management CLI"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.24"
crossterm = "0.27"
fyi-core = { version = "0.1.2", path = "../fyi-core" }
dhat = { version = "0.3.3", optional = true }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.5"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }

[features]
dhat-on = ["dep:dhat"]
