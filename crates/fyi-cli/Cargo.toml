[package]
name = "fyi-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.24"
crossterm = "0.27"
fyi-core = { path = "../fyi-core" }

[dev-dependencies]
wiremock = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }

dhat = { version = "0.3.3", optional = true }

[features]
dhat-on = ["dep:dhat"]
