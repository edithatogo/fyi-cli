[package]
name = "fyi-core"
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/edithatogo/fyi-cli"
description = "Core library for the fyi-cli multi-jurisdiction FOI/Alaveteli platform"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "migrate"] }
aes-gcm = "0.10"
aead = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
keyring = "2.1"
reqwest = { version = "0.13", features = ["json", "multipart", "query", "socks"] }
arti-client = { version = "0.11" }
tor-rtcompat = { version = "=0.9.7", features = ["rustls", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2.6"
sha2 = "0.10"
percent-encoding = "2.3"
qrcode = { version = "0.14", default-features = false }
toml = "0.8"

[dev-dependencies]
wiremock = "0.6"
proptest = "1.4"
