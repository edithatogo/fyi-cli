[package]
name = "fyi-core"
version = "0.1.2"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/edithatogo/fyi-cli"
description = "Core library for the fyi-cli multi-jurisdiction FOI/Alaveteli platform"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sqlx = { version = "^0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "macros", "chrono", "migrate"] }
aes-gcm = "0.11"
aead = "0.6"
getrandom = "0.3"
zeroize = { version = "1.7", features = ["derive"] }
keyring = "^4.2.0"
reqwest = { version = "^0.13", features = ["json", "multipart", "query", "socks"] }
arti-client = { version = "^0.48.0" }
tor-rtcompat = { version = "^0.48.0", features = ["rustls", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
thiserror = "1.0"
anyhow = "1.0"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2.6"
sha2 = "0.10"
percent-encoding = "2.3"
qrcode = { version = "0.14", default-features = false }
toml = "0.8"

[dev-dependencies]
wiremock = "0.6"
proptest = "1.4"
