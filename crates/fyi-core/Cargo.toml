[package]
name = "fyi-core"
version = "0.1.2"
edition = "2021"
rust-version = "1.99"
license = "MIT AND Apache-2.0"
repository = "https://github.com/edithatogo/fyi-cli"
description = "Core library for the fyi-cli multi-jurisdiction FOI/Alaveteli platform"

[features]
# Explicitly selected only by the standalone SDK regression fixture.
sdk-regression-fixture = ["dep:http"]

[dependencies]
http = { version = "1.5", optional = true }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
sqlx = { version = "^0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "macros", "migrate"] }
aes-gcm = "0.11"
aead = "0.6"
getrandom = "0.3"
zeroize = { version = "1.7", features = ["derive"] }
keyring = "^4.2.0"
reqwest = { version = "^0.13", features = ["json", "multipart", "query", "socks"] }
arti-client = { version = "^0.48.0" }
tor-rtcompat = { version = "^0.48.0", features = ["rustls", "tokio"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde", "serde-well-known"] }
csv = "1.4"
thiserror = "1.0"
anyhow = "1.0"
hmac = "0.12, ||, ^0"
sha1 = "0.10"
data-encoding = "2.6"
sha2 = "0.10"
flate2 = "1.1.11"
zip = { version = "9.5.1", default-features = false }
surt-rs = "0.1.3"
percent-encoding = "2.3"
regex = "1.13.1"
quick-xml = "0.42"
tempfile = "3.27"
qrcode = { version = "0.14", default-features = false }
toml = "0.8"
fluent-bundle = "0.16"
unic-langid = "0.9"

[dev-dependencies]
futures-util = "0.3"
h2 = "0.4.20"
http = "1.5"
reqwest = { version = "^0.13", features = ["stream"] }
tower = "0.5"
wiremock = "0.6"
proptest = "1.4"
