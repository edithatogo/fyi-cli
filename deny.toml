[graph]
all-features = true

[advisories]
version = 2
# NOTE (multi-jurisdiction-security-hardening track): the ids below are transitive
# advisories pulled in almost entirely by the optional Tor anonymity feature
# (arti-client + tor-rtcompat), which is beta-quality software with a large,
# fast-moving dependency graph (ring, curve25519-dalek, ed25519-dalek,
# rustls-pemfile, derivative, instant, paste, webpki/x509-parser). Bumping
# arti-client to pull in fixed transitives needs to be validated against a
# working Rust toolchain build (blocked locally by the Windows SDK linker) and
# is tracked as follow-up work rather than silently accepted forever. Do not
# add further ignores here without a corresponding tracking issue.
ignore = [
  "RUSTSEC-2024-0436", # paste unmaintained (via arti-client -> tor-*)
  "RUSTSEC-2023-0071", # rsa Marvin Attack timing sidechannel (via arti-client -> tor-*)
  # RUSTSEC-2026-0387: crypto-bigint timing variability. Blocked because
  # ssh-key-fork-arti 0.6.7 (latest) requires p256 ^0.13, which requires
  # elliptic-curve ^0.13, which requires crypto-bigint ^0.5. Cannot upgrade
  # to crypto-bigint >=0.7.6 without updating the entire chain. Revisit once
  # ssh-key-fork-arti supports p256 0.14+.
  "RUSTSEC-2026-0387",
  # RUSTSEC-2026-0459: libsqlite3-sys SQLite CVE-2026-119375. Blocked because
  # sqlx-sqlite 0.9.0 (latest) requires libsqlite3-sys <0.38.0, and rusqlite
  # 0.39.0 (latest compatible with tor-dirmgr 0.48.0) requires libsqlite3-sys
  # 0.37.0. Cannot upgrade to libsqlite3-sys >=0.39.0 without updating sqlx
  # and rusqlite. Revisit once sqlx or rusqlite releases a version that
  # supports libsqlite3-sys >=0.39.0.
  "RUSTSEC-2026-0459",
  # RUSTSEC-2026-0370/0371/0372: zbus_names, zvariant, zvariant_derive
  # unmaintained. Merged into zbus 6.0.0, but keyring v2.3.3 depends on
  # zbus v3.15.2 which still uses the unmaintained crates. Cannot upgrade
  # without updating keyring. Revisit once keyring supports zbus 6+.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
  "Unlicense",
  "OpenSSL"
]
confidence-threshold = 0.8

# `ring` embeds a composite LICENSE file (MIT/ISC/OpenSSL) that cargo-deny's
# text-similarity scorer can't confidently classify; the hash below matches the
# LICENSE text bundled with the currently-resolved ring 0.16.20, as reported by
# cargo-deny itself. See https://github.com/briansmith/ring/blob/main/LICENSE.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 },
]
